name = "pcgc"
main = "src/worker.js"
compatibility_date = "2026-04-01"

# HOSTNAME BINDING (not managed here):
#   The apex polkcountygolfcarts.com is attached to this Worker via
#   the Cloudflare dashboard's Custom Domains UI. www.* needs to be
#   attached there too — Custom Domains + wrangler `routes` can
#   collide for the same zone, so we leave both attachments to the
#   dashboard. Until www is added there, src/worker.js's www->apex
#   301 (below) never fires because no www request reaches the
#   Worker.

# Static-asset bucket.
#
# run_worker_first = true forces every request through the worker fetch
# handler FIRST, with the worker able to delegate to static assets via
# env.ASSETS.fetch(request). Without this, CF Static Assets short-
# circuits navigation requests to extensionless paths (e.g.
# /carts2/<slug>/) with the 404-page handler BEFORE the worker gets a
# chance to render them — asymmetric with AJAX fetch, which does fall
# through to the worker. That broke the /carts2/<slug>/ listing detail
# route on Nov 17: HTML navigations 404'd, fetch()s 200'd, from the
# same POP. run_worker_first = true restores the expected order.
#
# not_found_handling = "404-page" still applies, but ONLY when the
# worker itself calls env.ASSETS.fetch(request) and no asset matches.
[assets]
directory = "./site"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = true

# Stores one record per rental booking under the `booking:<ts>:<id>`
# prefix. (The name FEEDBACK_KV is kept as the binding for backwards
# compatibility with the existing namespace id.)
[[kv_namespaces]]
binding = "FEEDBACK_KV"
id = "be6aa9b721f34655b1596c8d8660097f"

# D1 database for case-study pipeline (GSC/Bing stats, AI Overview CSVs,
# IndexNow run log, traffic log). Binding kept as `DB` to match the
# midwestcnc reference implementation.
[[d1_databases]]
binding = "DB"
database_name = "pcgc-case-study"
database_id = "baecd3cc-0312-4487-a7c7-98ff1d45a8ab"

# Weekly case-study refresh — Mondays 13:00 UTC (early-morning CST)
[triggers]
crons = ["0 13 * * 1"]
