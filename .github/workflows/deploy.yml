name: Deploy Worker

on:
  push:
    branches: [main]
  # Manual trigger from the Actions tab in GitHub.
  workflow_dispatch:

# Only one deploy at a time — a rapid burst of pushes should collapse
# to one final deploy, not queue behind each other.
concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild static site
        run: python3 build.py

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
