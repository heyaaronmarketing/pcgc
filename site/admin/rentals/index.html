<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Rental Bookings · PCGC Admin</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logos/logo-color.svg">
  <link rel="stylesheet" href="/assets/site.css">
  <style>
    .bk-page { max-width: 960px; margin: 0 auto; padding: 2rem 1.25rem 6rem; }
    .bk-page h1 { color: var(--teal-dk); margin-bottom: .35rem; }
    .bk-page .sub { color: var(--ink-soft); margin-bottom: 2rem; }
    .bk-status { text-align: center; padding: 3rem; color: var(--ink-soft); }
    .bk-entry {
      background: #fff; border: 1px solid var(--line);
      border-left: 4px solid var(--teal-dk);
      border-radius: 10px; padding: 1.25rem 1.4rem;
      margin-bottom: 1rem;
      box-shadow: var(--shadow);
    }
    .bk-entry header {
      display: flex; gap: 1rem; align-items: baseline;
      justify-content: space-between; flex-wrap: wrap;
      font-size: .85rem; color: var(--ink-soft); margin-bottom: .65rem;
    }
    .bk-entry .id { font: 700 .95rem ui-monospace, monospace; color: var(--coral); }
    .bk-entry .ts { color: var(--ink-soft); }
    .bk-entry .grid {
      display: grid; gap: .85rem;
      grid-template-columns: 1fr 1fr;
      margin: .65rem 0;
    }
    @media (max-width: 600px) { .bk-entry .grid { grid-template-columns: 1fr; } }
    .bk-entry .field b { display: block; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
    .bk-entry .field span { color: var(--ink); }
    .bk-items {
      background: var(--bg); border-radius: 8px;
      padding: .65rem .85rem; margin-top: .65rem;
      font-size: .9rem;
    }
    .bk-items .row {
      display: flex; justify-content: space-between;
      padding: .15rem 0; color: var(--ink);
    }
    .bk-items .row.total { font-weight: 700; border-top: 1px solid var(--line); padding-top: .35rem; margin-top: .35rem; }
    .bk-empty { text-align: center; padding: 3rem 1rem; color: var(--ink-soft); }
    .bk-empty h2 { color: var(--teal-dk); }

    /* Status pill: color tracks the lifecycle. */
    .bk-pill {
      display: inline-flex; align-items: center; gap: .35rem;
      font: 700 .72rem ui-monospace, monospace;
      letter-spacing: .08em; text-transform: uppercase;
      padding: .25rem .6rem; border-radius: 999px;
      border: 1px solid currentColor;
    }
    .bk-pill[data-status="new"]         { color: #c2261a; background: #fde9e6; border-color: #f3c3bc; }
    .bk-pill[data-status="picked-up"]   { color: #1f5a68; background: #d6ecf0; border-color: #9fcfd7; }
    .bk-pill[data-status="delivered"]   { color: #1f5a68; background: #d6ecf0; border-color: #9fcfd7; }
    .bk-pill[data-status="returned"]    { color: #2f6b3b; background: #dff0e1; border-color: #a7d4ad; }
    /* Deposit-required indicator — pickup date is 3+ months out. */
    .bk-pill-deposit                    { color: #8a5a00; background: #fff2d1; border-color: #f0d78a; cursor: help; }

    /* Rental-agreement checklist — what to collect from the customer. */
    .bk-checklist {
      background: #fff9f4;
      border: 1px solid #f3c3bc;
      border-radius: 8px;
      padding: .6rem .85rem;
      margin-top: .85rem;
      font-size: .88rem;
      color: var(--ink);
    }
    .bk-checklist ul { margin: .35rem 0 0; padding-left: 1.2rem; }
    .bk-checklist li { padding: 1px 0; }

    .bk-status-row {
      display: flex; align-items: center; gap: .6rem;
      margin-top: .85rem; padding-top: .85rem;
      border-top: 1px dashed var(--line);
      font-size: .9rem;
    }
    .bk-status-row label { color: var(--ink-soft); font-weight: 600; }
    .bk-status-row select {
      font: inherit; padding: .35rem .6rem;
      border: 1px solid var(--line); border-radius: 6px;
      background: #fff;
    }
    .bk-status-row .bk-status-msg {
      margin-left: auto;
      font-size: .85rem; color: var(--ink-soft);
    }
    .bk-status-row .bk-status-msg.error { color: #c2261a; }
    .bk-status-row .bk-status-msg.success { color: #2f6b3b; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="/">
        <img class="brand-mark" src="/assets/logos/logo-color.svg" alt="" width="144" height="112" aria-hidden="true">
        <span class="brand-text">Polk County Golf Carts<small>Admin · Rentals</small></span>
      </a>
    </div>
  </header>
  <main class="bk-page">
    <!-- Login view: shown by default. The page hits /api/booking on load;
         if the API returns 401 we drop the user here. -->
    <section id="login-view" hidden>
      <h1>PCGC Admin</h1>
      <p class="sub">Sign in to see rental bookings.</p>
      <form id="login-form" style="max-width:340px; margin:0 auto; display:flex; flex-direction:column; gap:.75rem;">
        <label style="display:flex; flex-direction:column; gap:.35rem;">
          <span style="font-weight:600;">Password</span>
          <input type="password" id="login-password" required autocomplete="current-password" style="padding:.7rem .85rem; border:1px solid var(--line); border-radius:8px; font:inherit;">
        </label>
        <button type="submit" class="btn btn-coral" id="login-submit" style="margin-top:.35rem;">Sign in</button>
        <p id="login-error" style="color:#c2261a; margin:0; font-size:.92rem;" hidden></p>
      </form>
    </section>

    <!-- Bookings view: shown after successful auth. -->
    <section id="bookings-view" hidden>
      <header style="display:flex; align-items:baseline; justify-content:space-between; gap:1rem; flex-wrap:wrap;">
        <div>
          <h1 style="margin-bottom:.25rem;">Rental bookings</h1>
          <p class="sub" style="margin:0;">Submissions through the <a href="/rentals/">/rentals/</a> flow, newest first.</p>
        </div>
        <div style="display:flex; gap:.5rem;">
          <a href="/admin/dashboard/" class="btn btn-ghost" style="font-size:.92rem;">Conversion dashboard →</a>
          <a href="/admin/social-campaign/" class="btn btn-ghost" style="font-size:.92rem;">Social campaign →</a>
          <button type="button" id="logout-btn" class="btn btn-ghost" style="font-size:.92rem;">Sign out</button>
        </div>
      </header>

      <!-- Email diagnostics: click to send a real test email through
           Resend and get a plain-English answer about what happened. -->
      <details style="margin-top:1.25rem; background:#fff; border:1px solid var(--line); border-radius:10px; padding:.85rem 1.1rem;">
        <summary style="cursor:pointer; font-weight:600; color:var(--teal-dk);">🔧 Email diagnostics · test the booking notification pipeline</summary>
        <div style="margin-top:.85rem; display:flex; flex-direction:column; gap:.75rem;">
          <label style="display:flex; flex-direction:column; gap:.35rem; font-size:.92rem;">
            <span>Send test email to</span>
            <input type="email" id="test-email-to" placeholder="polkcountygolfcarts@yahoo.com (default)" style="padding:.55rem .7rem; border:1px solid var(--line); border-radius:6px; font:inherit;">
            <span style="font-size:.82rem; color:var(--ink-soft);">Leave blank to send to the configured address (polkcountygolfcarts@yahoo.com). If your Resend domain isn't verified yet, put your own Resend-signup email here — that's the only address Resend will let you send to in test mode.</span>
          </label>
          <button type="button" id="test-email-btn" class="btn btn-coral" style="align-self:flex-start;">Send test email</button>
          <div id="test-email-result" style="display:none; padding:.75rem 1rem; border-radius:8px; font-size:.92rem; white-space:pre-wrap; word-break:break-word;"></div>
        </div>
      </details>

      <div id="bk-out" class="bk-status" style="margin-top:1.5rem;">Loading…</div>
    </section>
  </main>
  <script>
  (() => {
    const loginView = document.getElementById("login-view");
    const bookingsView = document.getElementById("bookings-view");
    const out = document.getElementById("bk-out");
    const loginForm = document.getElementById("login-form");
    const loginPassword = document.getElementById("login-password");
    const loginSubmit = document.getElementById("login-submit");
    const loginError = document.getElementById("login-error");
    const logoutBtn = document.getElementById("logout-btn");

    function showLogin(msg) {
      bookingsView.hidden = true;
      loginView.hidden = false;
      if (msg) { loginError.textContent = msg; loginError.hidden = false; }
      else { loginError.hidden = true; }
      loginPassword.focus();
    }
    function showBookings() {
      loginView.hidden = true;
      bookingsView.hidden = false;
    }

    async function fetchAndRender() {
      out.textContent = "Loading…";
      out.className = "bk-status";
      let res;
      try {
        res = await fetch("/api/booking", { credentials: "same-origin" });
      } catch (e) {
        out.textContent = "Network error: " + e.message;
        return;
      }
      if (res.status === 401) { showLogin(); return; }
      if (!res.ok) {
        const t = await res.text();
        out.textContent = "Error " + res.status + ": " + t;
        return;
      }
      showBookings();
      const data = await res.json();
      renderEntries((data && data.entries) || []);
    }

    function renderEntries(entries) {
      // Clear any prior render — re-renders happen after login.
      [...document.querySelectorAll(".bk-entry")].forEach(el => el.remove());
      out.className = "";
      if (!entries.length) {
        out.innerHTML = '<div class="bk-empty"><h2>No bookings yet</h2><p>Customer rentals from /rentals/ will appear here.</p></div>';
        return;
      }
      out.textContent = "";
      const fmtMoney = n => "$" + (Number(n) || 0).toFixed(2);
      const fmtDate = iso => iso ? new Date(iso + "T00:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : "—";
      const deliveryLabel = { pickup: "Pickup at shop", local: "Free delivery (≤25 mi)", extended: "Extended delivery (25–100 mi, fee quoted separately)" };
      const statusLabel = { "new": "New Order", "picked-up": "Picked Up", "delivered": "Delivered", "returned": "Returned" };
      const statusOptions = ["new", "picked-up", "delivered", "returned"];
      // 3-months-out threshold for the 50% deposit indicator. Uses the
      // pickup date, matches the customer-facing rule on Step 4 of the
      // /rentals/ flow.
      const isFarOut = (startIso) => {
        if (!startIso) return false;
        const startMs = Date.parse(startIso + "T00:00:00");
        return Number.isFinite(startMs) && (startMs - Date.now()) / 86400000 >= 90;
      };
      // Rental-agreement checklist per delivery type — matches the docx
      // requirements list. Pickup needs DL + insurance + plate photo;
      // delivery needs DL only.
      const requirementsFor = (delivery) => delivery === "pickup"
        ? ["Driver's license (each driver)", "Auto insurance", "License plate photo"]
        : ["Driver's license (each driver)"];

      const fmtAddress = (c) => {
        const line1 = c.street || "";
        const line2 = [c.city, c.state].filter(Boolean).join(", ");
        const line3 = c.zip || "";
        return [line1, [line2, line3].filter(Boolean).join(" ")].filter(Boolean).join(" · ");
      };

      for (const b of entries) {
        const wrap = document.createElement("article");
        wrap.className = "bk-entry";
        const head = document.createElement("header");
        const status = b.status || "new";
        const c = b.contact || {};
        const depositBadge = isFarOut(b.dates?.start)
          ? `<span class="bk-pill bk-pill-deposit" title="Pickup is 3+ months out — collect 50% deposit to hold the booking">50% DEPOSIT</span>`
          : "";
        head.innerHTML = `<span class="id"></span><span class="bk-pill" data-status="${status}">${statusLabel[status] || status}</span>${depositBadge}<span class="ts"></span>`;
        head.querySelector(".id").textContent = b.id || "—";
        head.querySelector(".ts").textContent = new Date(b.ts).toLocaleString();
        wrap.appendChild(head);

        const grid = document.createElement("div");
        grid.className = "grid";
        grid.innerHTML = `
          <div class="field"><b>Customer</b><span></span></div>
          <div class="field"><b>Trip</b><span></span></div>
          <div class="field"><b>Contact</b><span></span></div>
          <div class="field"><b>Address</b><span></span></div>
          <div class="field"><b>Delivery</b><span></span></div>
          ${b.delivery !== "pickup" && c.address ? '<div class="field"><b>Drop-off location</b><span></span></div>' : ""}
        `;
        const cells = grid.querySelectorAll(".field span");
        cells[0].textContent = (c.name || "—") + " · " + (c.guests || 1) + " guests";
        cells[1].textContent = fmtDate(b.dates?.start) + " → " + fmtDate(b.dates?.end) + " (" + (b.dates?.days || 0) + " day" + ((b.dates?.days || 0) === 1 ? "" : "s") + ")";
        cells[2].textContent = (c.phone || "—") + " · " + (c.email || "—");
        cells[3].textContent = fmtAddress(c) || "—";
        cells[4].textContent = deliveryLabel[b.delivery] || b.delivery || "—";
        if (cells[5]) cells[5].textContent = c.address || "—";
        wrap.appendChild(grid);

        // Rental-agreement checklist card — reminder of what to
        // collect from the customer at time of payment. Renders when
        // the booking is still active (not yet returned) so John can
        // see at a glance what's outstanding.
        if (status !== "returned") {
          const checklist = document.createElement("div");
          checklist.className = "bk-checklist";
          const reqs = requirementsFor(b.delivery);
          checklist.innerHTML = `
            <b>Collect at time of payment (via text to 936-223-1182):</b>
            <ul>${reqs.map(r => `<li>${r}</li>`).join("")}</ul>
          `;
          wrap.appendChild(checklist);
        }

        if (c.notes) {
          const notes = document.createElement("p");
          notes.style.cssText = "margin: .35rem 0; font-style: italic; color: var(--ink-soft);";
          notes.textContent = "Notes: " + c.notes;
          wrap.appendChild(notes);
        }

        const items = document.createElement("div");
        items.className = "bk-items";
        const p = b.pricing || {};
        const rows = [];
        for (const it of (b.items || [])) {
          rows.push('<div class="row"><span>' + it.name + ' × ' + it.qty + '</span><span>' + fmtMoney(it.lineTotal) + '</span></div>');
        }
        if (b.delivery === "extended") rows.push('<div class="row"><span>Extended delivery</span><span>Quoted separately</span></div>');
        if (p.tax)           rows.push('<div class="row"><span>Tax</span><span>' + fmtMoney(p.tax) + '</span></div>');
        rows.push('<div class="row total"><span>Paid</span><span>' + fmtMoney(p.total) + '</span></div>');
        items.innerHTML = rows.join("");
        wrap.appendChild(items);

        // Agreement status card — signed / unsigned, with DL method
        // + optional thumbnail once the customer completes the page.
        const agreement = b.agreement || null;
        const agreeCard = document.createElement("div");
        agreeCard.className = "bk-checklist";
        agreeCard.style.background = agreement ? "#dff0e1" : "#fff9f4";
        agreeCard.style.borderColor = agreement ? "#a7d4ad" : "#f3c3bc";
        if (agreement) {
          const dlMethodLabel = { upload: "Photo uploaded on agreement page", text: "Customer said they'll text photo to 936-223-1182", "in-person": "Customer said they'll bring physical copy at pickup" };
          const dl = dlMethodLabel[agreement.dlMethod] || (agreement.dlMethod || "not specified");
          const parts = [
            "<b>✓ Rental agreement signed</b>",
            "<div style='margin-top:.35rem;'>By <b>" + (agreement.typedName || "—") + "</b> on " + new Date(agreement.signedAt).toLocaleString() + "</div>",
            "<div>DL: <code>" + (agreement.dlNumber || "—") + "</code> · " + (agreement.dlState || "—") + " · " + dl + "</div>",
          ];
          if (agreement.dlImageDataUrl) {
            parts.push("<img src='" + agreement.dlImageDataUrl + "' alt='Driver license' style='max-width:280px; max-height:180px; margin-top:.6rem; border:1px solid var(--line); border-radius:6px; background:#fff;'>");
          }
          if (agreement.signatureDataUrl) {
            parts.push("<div style='margin-top:.6rem;'><span style='font-size:.82rem; color:var(--ink-soft);'>Signature:</span><br><img src='" + agreement.signatureDataUrl + "' alt='Signature' style='max-height:80px; background:#fff; border:1px solid var(--line); border-radius:4px; padding:4px;'></div>");
          }
          agreeCard.innerHTML = parts.join("");
        } else {
          agreeCard.innerHTML = "<b>⏳ Rental agreement not signed yet</b><div style='margin-top:.35rem; color:var(--ink-soft); font-size:.9rem;'>Customer received a signing link in their confirmation email. Follow up if needed.</div>";
        }
        wrap.appendChild(agreeCard);

        // Status control: dropdown lets the owner advance the booking
        // through New -> Picked Up / Delivered -> Returned. Setting it
        // to "returned" triggers the customer thank-you email from the
        // Worker side.
        const statusRow = document.createElement("div");
        statusRow.className = "bk-status-row";
        statusRow.innerHTML = `
          <label for="status-${b.id}">Status</label>
          <select id="status-${b.id}" data-id="${b.id}">
            ${statusOptions.map(s => `<option value="${s}"${s === status ? " selected" : ""}>${statusLabel[s]}</option>`).join("")}
          </select>
          <span class="bk-status-msg"></span>
          <button type="button" class="bk-delete-btn" data-id="${b.id}" style="margin-left:auto; background:#fff; color:#b3392e; border:1px solid #b3392e; border-radius:6px; padding:.35rem .7rem; font-size:.82rem; font-weight:600; cursor:pointer;">Delete</button>
        `;
        wrap.appendChild(statusRow);

        const delBtn = statusRow.querySelector(".bk-delete-btn");
        let confirmArmed = false;
        let confirmTimer = null;
        delBtn.addEventListener("click", async () => {
          if (!confirmArmed) {
            confirmArmed = true;
            delBtn.textContent = "Click again to confirm";
            delBtn.style.background = "#b3392e";
            delBtn.style.color = "#fff";
            confirmTimer = setTimeout(() => {
              confirmArmed = false;
              delBtn.textContent = "Delete";
              delBtn.style.background = "#fff";
              delBtn.style.color = "#b3392e";
            }, 4000);
            return;
          }
          clearTimeout(confirmTimer);
          delBtn.disabled = true;
          delBtn.textContent = "Deleting…";
          try {
            const res = await fetch(`/api/booking/${encodeURIComponent(b.id)}`, {
              method: "DELETE",
              credentials: "same-origin",
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
              delBtn.disabled = false;
              delBtn.textContent = "Delete failed";
              msg.textContent = `Delete failed: ${data.error || res.status}`;
              msg.className = "bk-status-msg error";
              return;
            }
            wrap.style.transition = "opacity .25s ease, transform .25s ease";
            wrap.style.opacity = "0";
            wrap.style.transform = "translateX(-8px)";
            setTimeout(() => wrap.remove(), 260);
          } catch (e) {
            delBtn.disabled = false;
            delBtn.textContent = "Delete";
            msg.textContent = "Network error: " + e.message;
            msg.className = "bk-status-msg error";
          }
        });

        const sel = statusRow.querySelector("select");
        const msg = statusRow.querySelector(".bk-status-msg");
        const pill = head.querySelector(".bk-pill");
        sel.addEventListener("change", async () => {
          const newStatus = sel.value;
          const prevStatus = pill.dataset.status;
          if (newStatus === prevStatus) return;
          sel.disabled = true;
          msg.textContent = "Saving…";
          msg.className = "bk-status-msg";
          try {
            const res = await fetch(`/api/booking/${encodeURIComponent(b.id)}`, {
              method: "PATCH",
              headers: { "content-type": "application/json" },
              credentials: "same-origin",
              body: JSON.stringify({ status: newStatus }),
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
              msg.textContent = `Failed: ${data.error || res.status}`;
              msg.className = "bk-status-msg error";
              sel.value = prevStatus; // roll back the dropdown
              return;
            }
            // Update the pill in place.
            pill.dataset.status = newStatus;
            pill.textContent = statusLabel[newStatus];
            // Special-case the returned transition so the owner sees
            // whether the thank-you email actually went out.
            if (newStatus === "returned") {
              if (data.email === "sent") {
                msg.textContent = "Saved · thank-you email sent";
              } else if (data.email && data.email.startsWith("failed")) {
                msg.textContent = "Saved · email failed (" + data.email.slice(8) + ")";
                msg.className = "bk-status-msg error";
              } else if (data.email && data.email.startsWith("skipped")) {
                msg.textContent = "Saved · email skipped (no Resend key configured)";
              } else {
                msg.textContent = "Saved";
              }
            } else {
              msg.textContent = "Saved";
              msg.className = "bk-status-msg success";
            }
            setTimeout(() => { msg.textContent = ""; msg.className = "bk-status-msg"; }, 4000);
          } catch (e) {
            msg.textContent = "Network error: " + e.message;
            msg.className = "bk-status-msg error";
            sel.value = prevStatus;
          } finally {
            sel.disabled = false;
          }
        });

        document.querySelector("#bookings-view").appendChild(wrap);
      }
    }

    loginForm.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const password = loginPassword.value;
      if (!password) return;
      loginSubmit.disabled = true;
      const prev = loginSubmit.textContent;
      loginSubmit.textContent = "Signing in…";
      loginError.hidden = true;
      try {
        const res = await fetch("/api/admin/login", {
          method: "POST",
          headers: { "content-type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ password }),
        });
        if (!res.ok) {
          showLogin(res.status === 401 ? "Wrong password." : `Login failed (${res.status}).`);
          return;
        }
        loginPassword.value = "";
        await fetchAndRender();
      } catch (e) {
        showLogin("Network error: " + e.message);
      } finally {
        loginSubmit.disabled = false;
        loginSubmit.textContent = prev;
      }
    });

    logoutBtn.addEventListener("click", async () => {
      logoutBtn.disabled = true;
      try {
        await fetch("/api/admin/logout", { method: "POST", credentials: "same-origin" });
      } catch (_) { /* ignore — cookie may already be gone */ }
      showLogin();
      logoutBtn.disabled = false;
    });

    // Email diagnostics: click "Send test email", get a plain-English
    // answer back. The Worker's response has an `ok` + `hint` field —
    // we just surface the hint verbatim, plus config visibility so the
    // owner can see what from-address / to-address / key state the
    // Worker is actually using.
    const testBtn = document.getElementById("test-email-btn");
    const testInput = document.getElementById("test-email-to");
    const testResult = document.getElementById("test-email-result");
    testBtn.addEventListener("click", async () => {
      testBtn.disabled = true;
      const prev = testBtn.textContent;
      testBtn.textContent = "Sending…";
      testResult.style.display = "block";
      testResult.style.background = "#f4f0e8";
      testResult.style.color = "#333";
      testResult.textContent = "Contacting Resend…";
      try {
        const res = await fetch("/api/admin/test-email", {
          method: "POST",
          headers: { "content-type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ to: testInput.value.trim() || undefined }),
        });
        const data = await res.json();
        const cfg = data.config || {};
        const cfgLines = [
          `API key set:   ${cfg.resendKeySet ? "yes" : "NO"}`,
          `From:          ${cfg.fromEmail}${cfg.fromEmailIsDefault ? " (default — BOOKING_FROM_EMAIL not set)" : ""}`,
          `To (this test): ${cfg.toEmail}`,
        ].join("\n");
        const summary = data.ok
          ? `✓ Test email accepted by Resend.\n\n${data.hint}\n\nConfig:\n${cfgLines}`
          : `✗ Test failed (${data.reason}).\n\n${data.hint}\n\nConfig:\n${cfgLines}` +
            (data.resendResponse ? `\n\nRaw Resend response:\n${JSON.stringify(data.resendResponse, null, 2)}` : "");
        testResult.textContent = summary;
        testResult.style.background = data.ok ? "#e6f4ea" : "#fde9e6";
        testResult.style.color = data.ok ? "#1e4a2b" : "#7a1815";
      } catch (e) {
        testResult.textContent = "Network error: " + e.message;
        testResult.style.background = "#fde9e6";
        testResult.style.color = "#7a1815";
      } finally {
        testBtn.disabled = false;
        testBtn.textContent = prev;
      }
    });

    // Initial probe — if the cookie's already valid we go straight
    // to the bookings list; otherwise we land on the login form.
    fetchAndRender();
  })();
  </script>
</body>
</html>
